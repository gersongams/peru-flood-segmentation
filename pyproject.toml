[project]
name = "peru-flood-segmentation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "terratorch>=1.2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodseg"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
