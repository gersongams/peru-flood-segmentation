# TerraMind v1-B, Sentinel-2 L1C only (13 bands), fully fine-tuned.
# Necks, decoder, loss and lr follow IBM/terramind configs/terramind_v1_base_sen1floods11.yaml,
# except: S2L1C only (the official config also feeds S1GRD), our split lists, our stopping rule.
# Normalization: TerraMind pretraining stats (floodseg.normalization).
seed_everything: 0
trainer:
  max_epochs: 100
  log_every_n_steps: 5
  default_root_dir: outputs/runs/terramind_v1_base
  logger:
    class_path: lightning.pytorch.loggers.CSVLogger
    init_args:
      save_dir: outputs/runs/terramind_v1_base
  callbacks:
    - class_path: floodseg.provenance.RunProvenance
    - class_path: floodseg.callbacks.MPSMemoryGuard
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/IoU_Flood
        mode: max
        filename: best-{epoch}
        save_last: true
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/IoU_Flood
        mode: max
        patience: 20

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 8
    num_workers: 4
    dataset_bands: [COASTAL_AEROSOL, BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3, NIR_BROAD, NIR_NARROW, WATER_VAPOR, CIRRUS, SWIR_1, SWIR_2]
    output_bands: [COASTAL_AEROSOL, BLUE, GREEN, RED, RED_EDGE_1, RED_EDGE_2, RED_EDGE_3, NIR_BROAD, NIR_NARROW, WATER_VAPOR, CIRRUS, SWIR_1, SWIR_2]
    rgb_indices: [3, 2, 1]
    train_data_root: data/sen1floods11/v1.1/data/flood_events/HandLabeled/S2Hand
    train_label_data_root: data/sen1floods11/v1.1/data/flood_events/HandLabeled/LabelHand
    val_data_root: data/sen1floods11/v1.1/data/flood_events/HandLabeled/S2Hand
    val_label_data_root: data/sen1floods11/v1.1/data/flood_events/HandLabeled/LabelHand
    test_data_root: data/sen1floods11/v1.1/data/flood_events/HandLabeled/S2Hand
    test_label_data_root: data/sen1floods11/v1.1/data/flood_events/HandLabeled/LabelHand
    train_split: data/sen1floods11/v1.1/splits/flood_handlabeled/flood_train_data.txt
    val_split: data/sen1floods11/v1.1/splits/flood_handlabeled/flood_valid_data.txt
    test_split: data/sen1floods11/v1.1/splits/flood_handlabeled/flood_test_data.txt
    img_grep: "*_S2Hand.tif"
    label_grep: "*_LabelHand.tif"
    no_label_replace: -1
    no_data_replace: 0
    means: [2357.089, 2137.385, 2018.788, 2082.986, 2295.651, 2854.537, 3122.849, 3040.56, 3306.481, 1473.847, 506.07, 2472.825, 1838.929]
    stds: [1624.683, 1675.806, 1557.708, 1833.702, 1823.738, 1733.977, 1732.131, 1679.732, 1727.26, 1024.687, 442.165, 1331.411, 1160.419]
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2
    num_classes: 2

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: terramind_v1_base
      backbone_pretrained: true
      backbone_modalities: [S2L1C]
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_dropout: 0.1
      num_classes: 2
    loss: dice
    ignore_index: -1
    freeze_backbone: false
    freeze_decoder: false
    class_names: [Others, Flood]

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 2.e-5
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    monitor: val/loss
    factor: 0.5
    patience: 5
