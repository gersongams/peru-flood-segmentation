# Phase-D task 3.4 part 2: training-time input alignment Sen1Floods11 → Peru pool
# (floodseg.train_alignment; pre-registered in docs/METHODS_NOTES.md 2026-10-15).
# Overlay after the model config: the transform runs on raw DN before normalization, on
# train (before D4) and on valid (so checkpoint selection sees the same input style).
data:
  init_args:
    train_transform:
      - class_path: floodseg.train_alignment.HistMatchToPool
        init_args: {}
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2
    val_transform:
      - class_path: floodseg.train_alignment.HistMatchToPool
        init_args: {}
      - class_path: albumentations.pytorch.transforms.ToTensorV2
